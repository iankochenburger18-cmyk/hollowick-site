<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#171815" />
  <meta name="description" content="Sign in or create a Hollowick account to pick a plan and start creating." />
  <title>Sign in — Hollowick</title>
  <link rel="icon" type="image/png" href="/brand/favicon.png" />
  <link rel="preload" href="/fonts/manrope-400.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/fonts/instrument-serif-italic.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="stylesheet" href="/src/refinements.css" />
  <link rel="stylesheet" href="/src/footer.css" />
  <link rel="stylesheet" href="/src/signin.css" />
</head>
<body class="past-hero">
  <a class="skip-link" href="#main">Skip to content</a>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="arrow-up" viewBox="0 0 24 24"><path d="M6 18 18 6M6 6h12v12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
  </defs></svg>

  <header class="site-header" id="site-header">
    <a class="wordmark" href="/" aria-label="Hollowick home"><img class="brand-mark" src="/brand/hollowick-mark-chartreuse.png" alt="" width="32" height="35"/>hollowick<span class="brand-period">™</span></a>
    <nav class="desktop-nav" aria-label="Main navigation"><a href="/#models">The models</a><a href="/#possibilities">Possibilities</a><a href="/#how-it-works">The experience</a><a href="/pricing/">Pricing</a></nav>
    <div class="nav-actions"><button class="nav-studio" data-open-studio>Enter the studio <svg><use href="#arrow-up"/></svg></button><button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu"><span></span><span></span></button></div>
  </header>
  <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile navigation" hidden><a href="/#models">The models <span>01</span></a><a href="/#possibilities">Possibilities <span>02</span></a><a href="/#how-it-works">The experience <span>03</span></a><a href="/pricing/">Pricing <span>04</span></a><button data-open-studio>Enter the studio <svg><use href="#arrow-up"/></svg></button></nav>

  <main id="main">
    <section class="signin-section" aria-labelledby="signin-title">
      <div class="signin-card reveal">
        <div class="section-kicker"><span><span class="index-dot"></span> ACCOUNT</span></div>
        <h1 id="signin-title">Sign in to<br><em data-signin-emphasis>create.</em></h1>
        <p class="signin-sub" data-signin-sub>Sign in, or create an account, to continue.</p>

        <form class="signin-form" data-signin-form novalidate>
          <label class="signin-label" for="signin-email">Email</label>
          <input class="signin-input" id="signin-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <label class="signin-label" for="signin-password">Password</label>
          <input class="signin-input" id="signin-password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
          <div class="signin-actions">
            <button type="button" class="button button-lime signin-submit" data-signin-action="signin">Sign in</button>
            <button type="button" class="button button-dark signin-submit" data-signin-action="signup">Create account</button>
          </div>
        </form>
        <p class="signin-status" data-signin-status role="status" aria-live="polite"></p>

        <p class="signin-foot"><a href="/pricing/">Back to pricing</a></p>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="/src/signin.js"></script>
</body>
</html>
